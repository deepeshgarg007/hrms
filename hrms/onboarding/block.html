<div class="hr-onb">
  <div class="onb-head">
    <div class="onb-head-text">
      <h3 class="onb-title">Set up Frappe HR</h3>
      <p class="onb-sub">Pick the area you came here for. Each module walks you through everything it needs — shared basics like adding employees carry across every other module automatically.</p>
    </div>
    <div class="onb-overall" title="Overall setup progress">
      <span class="onb-overall-fig"><span data-overall-pct>0</span>%</span>
      <span class="onb-overall-label">set up</span>
      <span class="onb-overall-track"><span class="onb-overall-fill" data-overall-fill></span></span>
    </div>
  </div>

  <div class="onb-grid" data-grid></div>
</div>

<div class="onb-overlay" data-overlay hidden></div>

  <button class="onb-x" data-close aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <div class="onb-panel-head">
    <div class="onb-crumb"><span>Frappe HR</span><span class="onb-crumb-sep">/</span><span data-p-crumb>Module</span></div>
    <div class="onb-panel-title-row">
      <span class="onb-panel-ico" data-p-ico></span>
      <h4 class="onb-panel-title" data-p-title>Module</h4>
    </div>
    <div class="onb-panel-prog">
      <span class="onb-mini-track"><span class="onb-mini-fill" data-p-fill></span></span>
      <span class="onb-count" data-p-count>0 of 0</span>
    </div>
  </div>
  <div class="onb-panel-body">
    <p class="onb-intro" data-p-intro></p>
    <div class="onb-journey" data-p-journey></div>
  </div>
  <div class="onb-panel-foot">
    <button class="btn btn-primary btn-sm" data-p-cta>Get started</button>
  </div>
</aside>
